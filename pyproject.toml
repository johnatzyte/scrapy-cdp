[project]
name = "scrapy-cdp"
version = "0.1.0"
description = "A minimal Chromium CDP download handler for Scrapy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scrapy>=2.16",
    "websockets>=14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
